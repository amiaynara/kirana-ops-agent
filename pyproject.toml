[project]
name = "kirana-ops-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pydantic>=2.0,<3.0",
    "claude-agent-sdk>=0.2.128,<0.3.0",
    "python-telegram-bot>=22.8,<23.0",
    "reportlab>=5.0,<6.0",
    "matplotlib>=3.11,<4.0",
    "python-pptx>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pypdf>=5.0,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
